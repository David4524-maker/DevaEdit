<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevaEdit</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4eef7;--pn:#fff;--tx:#2b1a33;--mu:#7a6884;--ac:#a147a0;--bd:#e2d4e8;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#150f19;--pn:#211729;--tx:#f4eaf7;--mu:#a893b1;--bd:#3b2c45;color-scheme:dark}}
:root[data-theme=dark]{--bg:#150f19;--pn:#211729;--tx:#f4eaf7;--mu:#a893b1;--bd:#3b2c45;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif}
header{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{font:700 1.35rem Georgia,serif;letter-spacing:.02em}
header .sp{flex:1}
select,input[type=search],button,.b{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:.4rem .7rem;cursor:pointer}
.b.p,button.on{background:var(--ac);border-color:var(--ac);color:#fff}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sw{display:flex;gap:.4rem;align-items:center;cursor:pointer}
main{display:grid;grid-template-columns:1fr 380px;gap:1rem;padding:1rem}
@media(max-width:860px){main{grid-template-columns:1fr}}
section,aside{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:1rem}
.stage{container-type:size;position:relative;background:#000;border-radius:10px;overflow:hidden;margin:0 auto 1rem;width:min(100%,calc(50vh*var(--rn,1.778)));aspect-ratio:var(--rn,1.778)}
.md{position:absolute;inset:0}
.md>*{width:100%;height:100%;object-fit:contain;filter:var(--f,none);display:block}
.ph{background:linear-gradient(135deg,#ff5d73,#ffd23f 35%,#2ec27e 65%,#3b82f6)}
.ph::after{content:"DevaEdit";display:grid;place-items:center;height:100%;font:700 2rem Georgia,serif;color:#fff;text-shadow:0 2px 8px #0006}
[hidden]{display:none!important}
#ov{position:absolute;inset:0;pointer-events:none}
#ov>*{position:absolute;pointer-events:auto;cursor:move;touch-action:none;user-select:none;line-height:1.1}#ov .sel{outline:2px dashed #a147a0;outline-offset:2px}.stage.ms{outline:2px dashed #a147a0;outline-offset:-3px}#tt{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:.4rem;flex:1;min-width:7rem}#tc{height:2rem;width:2.5rem;border:1px solid var(--bd);border-radius:8px;background:none;padding:2px}
#tx{position:absolute;left:0;right:0;bottom:12%;text-align:center;pointer-events:none}
.wm{position:absolute;top:.5rem;inset-inline-start:.5rem;opacity:.42;pointer-events:none}
.logo{font-size:calc(var(--u,1)*10px);position:relative;width:14em;height:9em;flex:none;direction:ltr}
.logo i{display:block}
.logo .pen{display:flex}
.st,.st2{position:absolute;width:2.2em;height:2.6em;clip-path:polygon(0 0,100% 50%,0 100%)}
.st{left:8.2em;top:.7em;background:#fff}
.st2{left:8.9em;top:1.5em;background:#c084c4}
.film{position:absolute;inset:0;background:#a147a0;border-radius:.3em}
.film:before,.film:after{content:"";position:absolute;top:.4em;bottom:.4em;width:1.3em;background:radial-gradient(circle,#c4c4c4 0 .5em,transparent .55em) 0 0/1.3em 2.1em repeat-y}
.film:before{left:.4em}.film:after{right:.4em}
.pen{position:absolute;left:50%;top:50%;width:11.6em;height:2.8em;margin:-1.4em 0 0 -5.8em;display:flex;align-items:stretch;transform:rotate(-32deg);filter:drop-shadow(.15em .2em .2em #0005)}
.er{width:1.9em;background:linear-gradient(180deg,#ffc2d9 0 35%,#ff9fc2 35%);border-radius:1em .35em .35em 1em}
.fe{width:1.5em;background:linear-gradient(90deg,#a9a9a9 0 22%,#111 22% 32%,#a9a9a9 32% 68%,#111 68% 78%,#a9a9a9 78%);box-shadow:inset 0 .7em 0 #fff3,inset 0 -.6em 0 #0003}
.bd{flex:1;background:linear-gradient(180deg,#ffe066 0 28%,#ffc80f 28% 72%,#e09f00 72%)}
.tp{width:2.7em;background:linear-gradient(90deg,#f0e2b0 0 62%,#111 62%);clip-path:polygon(0 0,100% 50%,0 100%)}
.tl{position:relative;height:10px;background:var(--bd);border-radius:5px;margin:.6rem 0}
.tl i{position:absolute;top:0;bottom:0;background:var(--ac);border-radius:5px;opacity:.7}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.5rem 0}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
.sl label{display:grid;gap:.2rem;font-size:.85rem;color:var(--mu)}
input[type=range]{width:100%;accent-color:var(--ac)}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.6rem}
.tabs button{padding:.3rem .55rem;font-size:.85rem}
#q{width:100%;margin-bottom:.6rem}
#g{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;max-height:56vh;overflow:auto}
.t{padding:.3rem;text-align:center;font-size:.72rem;color:var(--mu)}
.pv{height:54px;border-radius:6px;margin-bottom:.25rem;display:grid;place-items:center;overflow:hidden;font-size:1.5rem;color:var(--tx);background:linear-gradient(135deg,#ff5d73,#ffd23f 35%,#2ec27e 65%,#3b82f6)}
.pv.n{background:var(--bg)}
.mu{color:var(--mu);font-size:.85rem}
@keyframes k0{50%{transform:scale(1.07)}}
@keyframes k1{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes k2{50%{opacity:.55}}
@keyframes k3{50%{transform:rotate(2deg)}}
@keyframes k4{50%{transform:scale(1.15) translateY(-3%)}}
@keyframes t0{from{opacity:0}}
@keyframes t1{from{transform:scale(.4);opacity:0}}
@keyframes t2{from{transform:translateX(100%)}}
@keyframes t3{from{transform:rotateY(90deg)}}
@keyframes t4{from{transform:rotate(180deg) scale(0)}}
@keyframes t5{from{transform:translateY(-100%)}}
@media(prefers-reduced-motion:reduce){.md{animation:none!important}}
#tw{position:relative;max-height:240px;background:#1b1b22;border-radius:8px;overflow:auto;margin:.6rem 0;touch-action:pan-y;cursor:pointer;user-select:none;scrollbar-width:thin}#ti{position:relative;height:84px;min-width:100%}
#fs{display:flex;height:54px;background:linear-gradient(90deg,#6b3f6e,#a147a0)}
#fs canvas{flex:1 1 0;min-width:0;height:100%;object-fit:cover}
.sh{position:absolute;top:0;height:54px;background:#000a;pointer-events:none}
#cb{position:absolute;top:56px;height:24px;background:#2e7bd6;color:#fff;font-size:.72rem;line-height:24px;padding:0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px}
#cb i{position:absolute;top:0;bottom:0;width:9px;background:#9cc8ff;cursor:ew-resize}
#cb .hl{left:0}#cb .hr{right:0}
#pf{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#e53935;pointer-events:none}
#pf:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#e53935}
#shs{position:absolute;left:0;right:0;top:0;height:54px;pointer-events:none}
#sgs{position:absolute;left:0;right:0;top:56px;height:24px}
.sg{position:absolute;top:0;bottom:0;background:#2e7bd6;color:#fff;font-size:.72rem;line-height:24px;padding:0 14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:2px solid #fffd}
.sg i{position:absolute;top:0;bottom:0;width:9px;background:#9cc8ff;cursor:ew-resize}
.sg .hl{left:0}.sg .hr{right:0}
#fg b{font:700 1rem Georgia,serif}
#fgr{display:grid;grid-template-columns:repeat(8,1fr);gap:.3rem;margin-bottom:.8rem}
#fgr button{padding:.3rem;display:grid;place-items:center;height:34px}
#fgr i{display:block;width:20px;background:var(--ac)}
#t0,#t1{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:.3rem}
#sc{height:2rem;width:2.5rem;border:1px solid var(--bd);border-radius:8px;background:none;padding:2px}
#lt{position:absolute;left:0;right:0;top:84px}
.lb{position:absolute;height:20px;border-radius:4px;color:#fff;font-size:.7rem;line-height:20px;padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:grab;min-width:8px}
.lb.on{outline:2px solid #fff;outline-offset:-1px}
.lb i{position:absolute;top:0;bottom:0;width:7px;background:#fff6;cursor:ew-resize}
.lb .hl{left:0}.lb .hr{right:0}
#rz{width:14px;height:14px;background:#fff;border:2px solid #a147a0;border-radius:50%;cursor:nwse-resize;display:none;margin:-8px 0 0 -8px;z-index:5}

/* ---- Interfaces: CapCut, FlipAnim, FlipaClip, DaVinci Resolve, Clipchamp, Filmora */
#dw,#og{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#dw{touch-action:none}#og{opacity:.3;display:none}
body[data-ui=flipanim] #dw,body[data-ui=flipaclip] #dw{pointer-events:auto;cursor:crosshair}
body[data-ui=flipanim] #og,body[data-ui=flipaclip] #og{display:block}
#fr{display:flex;gap:.4rem;overflow:auto;padding-bottom:.3rem}#fr button{flex:none;padding:.2rem;font-size:.7rem;display:grid;gap:.1rem;justify-items:center}#fr canvas{width:96px;height:54px;background:#fff;border-radius:4px}
#dz{width:7rem}#dc{height:2rem;width:2.5rem;border:1px solid var(--bd);border-radius:8px;background:none;padding:2px}
#pg{display:none;position:sticky;bottom:0;justify-content:center;gap:.3rem;padding:.4rem;background:var(--pn);border-top:1px solid var(--bd);z-index:9}
body[data-ui=resolve] #pg{display:flex}
#pg button{border-color:transparent;background:none;color:var(--mu)}#pg button.on{color:var(--ac);border-bottom-color:var(--ac)}
body[data-ui]{--ot:#fff}
body[data-ui] :is(.b.p,button.on){color:var(--ot)}
body[data-ui] :is(select,input[type=search],button,.b){border-radius:var(--r,8px)}
body[data-ui] :is(section,aside){border-radius:var(--rp,14px)}
body[data-ui] :is(.sg,#cb){background:var(--cl,#2e7bd6)}
body[data-ui] #pf{background:var(--pf,#e53935)}body[data-ui] #pf:before{border-top-color:var(--pf,#e53935)}
body[data-ui=capcut]{--bg:#000;--pn:#121214;--tx:#f5f5f5;--mu:#8b8b93;--ac:#25f4ee;--bd:#26262b;--cl:#1c8c88;--pf:#fff;--r:999px;--rp:18px;--ot:#000;color-scheme:dark}
body[data-ui=flipanim]{--bg:#fff1c9;--pn:#fffaf0;--tx:#3a2a00;--mu:#8a6d1f;--ac:#ff8a00;--bd:#f0d98c;--cl:#ff8a00;--pf:#d62828;--r:14px;--rp:22px;color-scheme:light}
body[data-ui=flipaclip]{--bg:#23272e;--pn:#2d323b;--tx:#eceff4;--mu:#98a1b0;--ac:#ff9f1c;--bd:#414855;--cl:#3d7be0;--pf:#ff9f1c;--r:6px;--rp:8px;--ot:#1b1200;color-scheme:dark}
body[data-ui=resolve]{--bg:#1b1b1d;--pn:#262628;--tx:#d4d4d8;--mu:#85858c;--ac:#e0592a;--bd:#38383c;--cl:#6b7f3a;--pf:#e0592a;--r:3px;--rp:0;color-scheme:dark}
body[data-ui=clipchamp]{--bg:#eceef8;--pn:#fff;--tx:#1d1d2b;--mu:#6b6f86;--ac:#5b3fd1;--bd:#d9dcea;--cl:#7a62e8;--pf:#5b3fd1;--r:8px;--rp:12px;color-scheme:light}
body[data-ui=filmora]{--bg:#17191c;--pn:#202327;--tx:#e6e8ea;--mu:#8a9099;--ac:#00d4a8;--bd:#2f3338;--cl:#12957a;--pf:#00d4a8;--r:4px;--rp:6px;--ot:#00110d;color-scheme:dark}
body[data-ui=capcut] .tabs button{border:0;background:none;border-radius:0;color:var(--mu)}
body[data-ui=capcut] .tabs button.on{color:var(--ac);box-shadow:inset 0 -2px var(--ac)}
body[data-ui=clipchamp] header,body[data-ui=flipanim] header{background:var(--ac);color:#fff;border-color:var(--ac)}
body[data-ui=clipchamp] header .mu,body[data-ui=flipanim] header .mu{color:#fffd}
body[data-ui=filmora] header{border-bottom:2px solid var(--ac)}
body[data-ui=resolve] header{padding:.25rem .6rem}body[data-ui=resolve] header b{font:600 .95rem system-ui,sans-serif}
body[data-ui=resolve] .stage{border:1px solid var(--bd);border-radius:0}
@media(min-width:861px){
body[data-ui=capcut] main{grid-template-columns:360px 1fr}
body[data-ui=clipchamp] main{grid-template-columns:300px 1fr}
body[data-ui=filmora] main{grid-template-columns:minmax(320px,42%) 1fr}
body[data-ui=resolve] main{grid-template-columns:320px 1fr;gap:3px;padding:3px}
body[data-ui=flipaclip] main{grid-template-columns:1fr 300px}
body[data-ui=flipanim] main{grid-template-columns:1fr}
body[data-ui=capcut] aside,body[data-ui=clipchamp] aside,body[data-ui=filmora] aside,body[data-ui=resolve] aside{order:-1}
body[data-ui=flipanim] #g{grid-template-columns:repeat(8,1fr);max-height:26vh}}
body[data-ui=resolve][data-pg=media] main{grid-template-columns:1fr}
body[data-ui=resolve][data-pg=media] section{display:none}
body[data-ui=resolve][data-pg=media] #g{max-height:70vh}
body[data-ui=resolve][data-pg=color] #tw,body[data-ui=resolve][data-pg=deliver] #tw{display:none}
body[data-ui=resolve][data-pg=color] .sl{padding:1rem;outline:2px solid var(--ac)}
body[data-ui=resolve][data-pg=deliver] .row:has(#ex){outline:2px solid var(--ac);padding:.5rem}
</style></head>
<body>

 <div class="logo" style="--u:.5"></div><b>DevaEdit</b><span class="mu" id="tot"></span><span class="sp"></span>
 <select id="ui" aria-label="Interface"></select>

 <label class="sw"><input type="checkbox" id="hw"><span data-t="1"></span></label>

<main>

 <div class="stage" id="st">

 </div>
 <div id="an" hidden>

 <div class="row">

  <label class="b p"><input type="file" id="fi" accept="video/*" hidden><span data-t="0"></span></label>
  <button id="pl">▶</button><span class="mu" id="tm">0:00</span>
  <button id="si" data-t="8"></button><button id="so" data-t="9"></button>
  <select id="sp" aria-label="Speed"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select>
  <span class="mu" data-t="27"></span><select id="ef" aria-label="Export as"><option>WebM</option><option>MP4</option><option>PNG</option><option>JPG</option></select><button id="ex" data-t="10"></button><button id="rs" data-t="11"></button>
 </div>
 <div class="sl">
  <label><span data-t="4"></span><input type="range" id="vo" min="0" max="1" step="0.05" value="1"></label>
  <label><span data-t="5"></span><input type="range" id="br" min="0.4" max="1.8" step="0.05" value="1"></label>

</section>

<script>
const $=s=>document.querySelector(s),v=$("#v"),md=$("#md"),st=$("#st");
const T={
